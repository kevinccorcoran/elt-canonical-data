<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns Analyzer Configuration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>Returns Analyzer</h1>
    </header>

    <main>
        <section class="controls-panel card">
            <div>
                <h2 class="section-title">Configure Data</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Bucket</th>
                            <th>Record %</th>
                            <th>Returns (%)</th>
                        </tr>
                    </thead>
                    <tbody id="data-inputs">
                        <!-- Generated by JS -->
                    </tbody>
                </table>
            </div>

            <div class="button-group">
                <button class="btn-outline" onclick="resetData()">Reset</button>
                <button class="btn-primary" onclick="updateChart()">Update Chart</button>
            </div>
        </section>

        <section class="chart-panel card">
            <div class="chart-container">
                <canvas id="returnsChart"></canvas>
            </div>
        </section>
    </main>

    <script>
        const initialData = [
            { bucket: 1, pct: 0.11, returns: 61.65 },
            { bucket: 2, pct: 4.00, returns: 36.45 },
            { bucket: 3, pct: 12.00, returns: 16.32 },
            { bucket: 4, pct: 28.00, returns: 13.23 },
            { bucket: 5, pct: 39.00, returns: 13.75 },
            { bucket: 6, pct: 15.00, returns: -0.44 },
            { bucket: 7, pct: 1.00, returns: 5.84 }
        ];

        let chart;

        async function init() {
            let data = initialData;

            try {
                const response = await fetch('data.json');
                if (response.ok) {
                    const externalData = await response.json();
                    if (externalData && externalData.length > 0) {
                        data = externalData;
                        console.log('Loaded data from data.json');
                    }
                }
            } catch (e) {
                console.log('Could not load data.json, falling back to initialData');
            }

            renderInputs(data);
            initChart(data);
        }

        function renderInputs(data) {
            const container = document.getElementById('data-inputs');
            container.innerHTML = data.map((row, i) => `
                <tr>
                    <td><input type="number" value="${row.bucket}" data-idx="${i}" data-key="bucket" disabled></td>
                    <td><input type="number" step="0.01" value="${row.pct}" data-idx="${i}" data-key="pct" onchange="autoUpdate()"></td>
                    <td><input type="number" step="0.01" value="${row.returns}" data-idx="${i}" data-key="returns" onchange="autoUpdate()"></td>
                </tr>
            `).join('');
        }

        function getData() {
            const inputs = document.querySelectorAll('#data-inputs input');
            const data = [...initialData];
            inputs.forEach(input => {
                if (input.disabled) return;
                const idx = input.getAttribute('data-idx');
                const key = input.getAttribute('data-key');
                data[idx][key] = parseFloat(input.value) || 0;
            });
            return data;
        }

        function autoUpdate() {
            // Optional: call updateChart() here for real-time
            updateChart();
        }

        function resetData() {
            renderInputs(JSON.parse(JSON.stringify(initialData)));
            updateChart();
        }

        function initChart(data) {
            const ctx = document.getElementById('returnsChart').getContext('2d');

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => `Bucket ${d.bucket}`),
                    datasets: [
                        {
                            label: 'Record Percentage (%)',
                            data: data.map(d => d.pct),
                            backgroundColor: 'rgba(56, 189, 248, 0.4)',
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            borderRadius: 6,
                            yAxisID: 'yLeft',
                            order: 2
                        },
                        {
                            label: 'Median Future Excess Return (%)',
                            data: data.map(d => d.returns),
                            type: 'line',
                            borderColor: '#ef4444',
                            backgroundColor: '#ef4444',
                            borderWidth: 3,
                            pointBackgroundColor: '#ef4444',
                            pointRadius: 5,
                            pointHoverRadius: 8,
                            tension: 0.3,
                            yAxisID: 'yRight',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#94a3b8',
                                font: { family: 'Inter', size: 12, weight: '500' },
                                padding: 20
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            padding: 12,
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#64748b' }
                        },
                        yLeft: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Record Percentage per ID (%)',
                                color: '#38bdf8',
                                font: { weight: '600' }
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#64748b' },
                            suggestedMax: 45
                        },
                        yRight: {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Median Future Excess Return vs SPY (%)',
                                color: '#ef4444',
                                font: { weight: '600' }
                            },
                            grid: { display: false },
                            ticks: { color: '#64748b' },
                            suggestedMin: -5,
                            suggestedMax: 65
                        }
                    }
                }
            });
        }

        function updateChart() {
            const data = getData();
            chart.data.labels = data.map(d => `Bucket ${d.bucket}`);
            chart.data.datasets[0].data = data.map(d => d.pct);
            chart.data.datasets[1].data = data.map(d => d.returns);
            chart.update();
        }

        window.onload = init;
    </script>
</body>

</html>
