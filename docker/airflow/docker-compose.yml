x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
    PROJECT_ROOT: /opt/elt-canonical-data
    PYTHONPATH: /opt/elt-canonical-data/src
    QUALSTREAM_ROOT: /opt/qualstream
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../src:/opt/elt-canonical-data/src
    # - ../../airflow/logs:/opt/airflow/logs
    - ../../dbt:/opt/elt-canonical-data/dbt
    - ../../tools:/opt/elt-canonical-data/tools
    - ../../.dbt:/home/airflow/.dbt
    - ../../../elt-inference-models:/opt/elt-inference-models
    - ../../../qualstream:/opt/qualstream
    - ../../scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - ./airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost" ]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: bash -c "airflow db upgrade"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: bash -c "airflow scheduler"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: bash -c "airflow webserver"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-shiny:
    <<: *airflow-common
    container_name: airflow-shiny
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Resilient launcher: app.R in a restart loop (crash/OOM self-heals) plus a
    # watchdog that restarts it if 3838 stops responding (hang self-heals).
    command: bash /opt/airflow/scripts/shiny_entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://localhost:3838/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      - "3838:3838"
