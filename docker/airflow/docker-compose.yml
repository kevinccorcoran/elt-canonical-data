x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - .env
  # Pin reliable public resolvers + fail-fast resolver options. The container's
  # default upstream DNS intermittently returns EAI_AGAIN ("Temporary failure in
  # name resolution") when reaching the managed-DB public hostname, which the
  # Shiny dashboard dials on every connect. timeout:2/attempts:3 makes a blip
  # fail fast and roll to the second server instead of hanging on the first.
  dns:
    - 8.8.8.8
    - 1.1.1.1
  dns_opt:
    - timeout:2
    - attempts:3
    - rotate
  # Map host.docker.internal for EVERY inheriting service (webserver/scheduler/
  # init/shiny). The DAGs and the dashboard's Staging/Dev presets dial the host's
  # native Postgres via this name; under engines without Docker-Desktop's implicit
  # resolution (e.g. OrbStack) it does not resolve unless mapped here.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
    PROJECT_ROOT: /opt/elt-canonical-data
    PYTHONPATH: /opt/elt-canonical-data/src
    QUALSTREAM_ROOT: /opt/qualstream
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../src:/opt/elt-canonical-data/src
    # - ../../airflow/logs:/opt/airflow/logs
    - ../../dbt:/opt/elt-canonical-data/dbt
    - ../../tools:/opt/elt-canonical-data/tools
    - ../../.dbt:/home/airflow/.dbt
    - ../../../elt-inference-models:/opt/elt-inference-models
    - ../../../qualstream:/opt/qualstream
    - ../../scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback-only: metadata DB must not be reachable off-host.
      - "127.0.0.1:5435:5432"
    volumes:
      - ./airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost" ]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: bash -c "airflow db upgrade"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: bash -c "airflow scheduler"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # (airflow-webserver service removed: the combined `airflow` container serves
  # the UI and owns host port 8080, so a separate webserver service could never
  # bind -- it sat permanently in Created/port-conflict state.)
  #
  # ---------------------------------------------------------------------------
  # LEGACY CONTAINER, READ BEFORE `docker compose up -d`.
  # A container named plain `airflow` (created 2026-05-26, same compose project,
  # from a since-split single-service definition) is what actually serves prod:
  #     airflow db upgrade && Rscript app.R & Rscript app_violin.R &
  #     airflow webserver & airflow scheduler
  # It owns host ports 3838 (this board), 3839 (violin) and 8080 (Airflow UI),
  # and `docker compose up` never removed it because the service was renamed
  # rather than deleted (orphans survive without --remove-orphans).
  #
  # Consequences, all observed rather than theorised:
  #   * airflow-shiny below can never bind 3838, so it published no ports, ran
  #     no R process at all, and was stopped on 2026-08-05. Starting it again
  #     without freeing 3838 just recreates dead weight.
  #   * two schedulers run (here and in the legacy container). This is FINE --
  #     Airflow 2 supports multiple schedulers, and `airflow jobs check
  #     --job-type SchedulerJob --hostname $HOSTNAME` reports one alive job per
  #     host. A check without --hostname says "Found 2 alive jobs", which is
  #     the HA topology, not a fault.
  #
  # DECOMMISSIONED 2026-08-05: the two services below (airflow-webserver and
  # airflow-violin) restore what the legacy container uniquely provided, so it
  # was stopped and every role now runs in its own service. It is stopped, NOT
  # removed -- `docker start airflow` is the rollback, and it will re-seize
  # 3838/3839/8080 if the compose services are not running. Do not run
  # `docker compose up --remove-orphans` until you are happy to lose that
  # rollback. Verified before the swap: the shiny image serves 200 on a spare
  # port, and its httpuv/later stack (1.6.9/1.3.0) is identical to the legacy
  # container's, so the swap changed nothing about the segfault-ABI warning the
  # entrypoint prints -- that predates this and needs an image rebuild.
  # ---------------------------------------------------------------------------

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: bash -c "airflow webserver"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      # Loopback-only: reach remotely via SSH tunnel.
      - "127.0.0.1:8080:8080"

  # Second Shiny board (violin). app_violin.R hardcodes host=0.0.0.0 port=3839,
  # so unlike app.R it needs no SHINY_PORT and has no watchdog wrapper.
  airflow-violin:
    <<: *airflow-common
    container_name: airflow-violin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "Rscript /opt/airflow/scripts/app_violin.R"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://localhost:3839/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      # Loopback-only: unauthenticated dashboard. Reach remotely via SSH tunnel.
      - "127.0.0.1:3839:3839"

  airflow-shiny:
    <<: *airflow-common
    container_name: airflow-shiny
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # host.docker.internal is mapped on the shared anchor above (all services).
    # Resilient launcher: app.R in a restart loop (crash/OOM self-heals) plus a
    # watchdog that restarts it if the port stops responding (hang self-heals).
    command: bash /opt/airflow/scripts/shiny_entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 http://localhost:3838/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      # Loopback-only: unauthenticated dashboard. Reach remotely via SSH tunnel.
      - "127.0.0.1:3838:3838"
