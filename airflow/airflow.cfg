# ============================================================
# Airflow Configuration
# ============================================================
# This file defines how Airflow runs.
# Secrets are NEVER stored here.
# Secrets are always loaded from environment variables.
# ============================================================


# ----------------------------
# Core behaviour
# ----------------------------
[core]
# Where DAG files live
dags_folder = /opt/elt-canonical-data/airflow/dags

# Single-machine executor
executor = SequentialExecutor

# Do not load example DAGs
load_examples = False

# Default timezone
default_timezone = UTC


# ----------------------------
# Database (metadata only)
# ----------------------------
[database]
# Metadata DB connection
# Comes from environment
sql_alchemy_conn = ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}


# ----------------------------
# Web UI
# ----------------------------
[webserver]
# Base URL for UI
base_url = http://localhost:8080

# Listen on all interfaces
web_server_host = 0.0.0.0
web_server_port = 8080

# Flask secret (from env, never in git)
secret_key = ${AIRFLOW__WEBSERVER__SECRET_KEY}

# Use DB-backed sessions
session_backend = database

# Gunicorn workers
workers = 2


# ----------------------------
# Logging
# ----------------------------
[logging]
# Where logs are stored
base_log_folder = /opt/elt-canonical-data/airflow/logs

# Log level
logging_level = INFO

# Show logs in UI
colored_console_log = True


# ----------------------------
# Scheduler
# ----------------------------
[scheduler]
# How often scheduler loops
scheduler_heartbeat_sec = 5

# DAG parsing interval
min_file_process_interval = 30

# Number of DAG parsing processes
parsing_processes = 2


# ----------------------------
# API
# ----------------------------
[api]
# Use session-based auth
auth_backends = airflow.api.auth.backend.session


# ----------------------------
# Email (disabled)
# ----------------------------
[email]
email_backend = airflow.utils.email.send_email_smtp
default_email_on_failure = False
default_email_on_retry = False
