# Project Metadata
name: 'dbt_project'
version: '1.0.0'
config-version: 2

# Profile Configuration
profile: 'dbt_project'

# File Paths Configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Clean Targets Configuration
clean-targets:
  - "target"
  - "dbt_packages"

# Model Configuration
models:
  dbt_project:
    # All models use the database defined via environment variables
    +database: "{{ env_var('DB_DATABASE', 'prod') }}"

    app:
      # Default schema for application models (canonical data model)
      +schema: cdm

      # Data validation, checks, and quality-related models
      data_quality:
        +schema: data_quality

  elt_inference_models:
    +database: "{{ env_var('DB_DATABASE', 'prod') }}"
