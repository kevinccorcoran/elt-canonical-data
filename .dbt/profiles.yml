dbt_project:
  target: dev
  outputs:
    dev:
      type: postgres
      threads: 2
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      user: "{{ env_var('DB_USER') }}"
      pass: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_DATABASE') }}"
      schema: cdm
      sslmode: prefer
      keepalives_idle: 30
      keepalives_interval: 10
      keepalives_count: 5

    staging:
      type: postgres
      threads: 2
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      user: "{{ env_var('DB_USER') }}"
      pass: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_DATABASE') }}"
      schema: cdm
      sslmode: prefer
      keepalives_idle: 30
      keepalives_interval: 10
      keepalives_count: 5

    prod:
      type: postgres
      threads: 2
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      user: "{{ env_var('DB_USER') }}"
      pass: "{{ env_var('DB_PASSWORD') }}"
      dbname: "prod"
      schema: cdm
      sslmode: prefer
      keepalives_idle: 30
      keepalives_interval: 10
      keepalives_count: 5
